<table>
  <thead>
    <tr>
      @for (header of columnHeaders; track header) {
        <th>{{ header }}</th>
      }
    </tr>
  </thead>
  <tbody>
    @for (row of data; track row; let i = $index) {
      <tr
        (click)="onRowClick(row)"
        [style.backgroundColor]="getRowColor(row.userId)"
        >
        @for (header of dataKeys; track header) {
          <td
            [style.backgroundColor]="getCellColor(row.userId, header) || (i % 2 === 0 ? 'var(--block-child-background)' : 'var(--block-background)')"
            >
            {{ row[header] }}
          </td>
        }
      </tr>
    }
  </tbody>
</table>
