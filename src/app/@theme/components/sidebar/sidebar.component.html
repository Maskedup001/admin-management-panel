<aside [class.show]="isSidebarVisible">
  <button class="toggle-button" (click)="toggleSidebar()">
    @if (isSidebarVisible) {
      <span>←</span>
    }
    @if (!isSidebarVisible) {
      <span>→</span>
    }
  </button>
  <app-menu-childrens [sidebarHidden]="!isSidebarVisible"></app-menu-childrens>
</aside>
